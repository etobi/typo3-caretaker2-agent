<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

    <h1>Caretaker2</h1>

    <f:if condition="{message}">
        <div class="callout callout-{messageSeverity}">
            <div class="callout-content">
                <div class="callout-body">{message}</div>
            </div>
        </div>
    </f:if>

    <f:if condition="{connected}">
        <f:then>
            <div class="callout callout-success">
                <div class="callout-content">
                    <div class="callout-title"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connected.title"/></div>
                    <div class="callout-body">
                        <p><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connected.body" arguments="{0: '{hubUrl}'}"/></p>
                        <f:if condition="{hubUser}">
                            <p class="mb-0"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connected.basicAuth" arguments="{0: '{hubUser}'}"/></p>
                        </f:if>
                        <f:if condition="{managedByEnvironment}">
                            <p class="mb-0"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connected.managed"/></p>
                        </f:if>
                    </div>
                </div>
            </div>

            <div class="callout callout-{f:if(condition: '{schedulerTaskExists} && {schedulerTaskRecurring}', then: 'success', else: 'warning')}">
                <div class="callout-content">
                    <div class="callout-title"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.title"/></div>
                    <div class="callout-body">
                        <f:if condition="{schedulerTaskExists}">
                            <f:then>
                                <f:if condition="{schedulerTaskRecurring}">
                                    <f:then>
                                        <p class="mb-0"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.exists" arguments="{0: '{pushCommand}'}"/></p>
                                    </f:then>
                                    <f:else>
                                        <p><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.notRecurring" arguments="{0: '{pushCommand}'}"/></p>
                                        <form method="post">
                                            <button type="submit" name="repairTask" value="1" class="btn btn-default">
                                                <f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.repair"/>
                                            </button>
                                        </form>
                                    </f:else>
                                </f:if>
                            </f:then>
                            <f:else>
                                <p><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.missing"/></p>
                                <f:if condition="{schedulerAvailable}">
                                    <f:then>
                                        <form method="post">
                                            <button type="submit" name="installTask" value="1"
                                                    class="btn btn-default">
                                                <f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.create"/>
                                            </button>
                                        </form>
                                    </f:then>
                                    <f:else>
                                        <p class="mb-0"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:schedule.unavailable" arguments="{0: '{pushCommand}'}"/></p>
                                    </f:else>
                                </f:if>
                            </f:else>
                        </f:if>
                    </div>
                </div>
            </div>

            <form method="post" class="mb-4">
                <button type="submit" name="push" value="1" class="btn btn-primary">
                    <f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:button.push"/>
                </button>
                <f:if condition="{managedByEnvironment}">
                    <f:else>
                        <button type="submit" name="disconnect" value="1" class="btn btn-default">
                            <f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:button.disconnect"/>
                        </button>
                    </f:else>
                </f:if>
            </form>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <div class="callout-content">
                    <div class="callout-title"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.title"/></div>
                    <div class="callout-body">
                        <p class="mb-0"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.body"/></p>
                    </div>
                </div>
            </div>

            <form method="post" class="mb-4">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label" for="c2-hub"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.hubUrl"/></label>
                            <input type="url" class="form-control" id="c2-hub" name="hubUrl"
                                   value="{hubUrl}" placeholder="https://caretaker.example.com"
                                   required="required">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label class="form-label" for="c2-code"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.code"/></label>
                            <input type="text" class="form-control" id="c2-code" name="code"
                                   placeholder="ABCD-1234" style="text-transform:uppercase"
                                   autocomplete="off" required="required">
                        </div>
                    </div>
                </div>
                <details class="mb-3">
                    <summary class="text-body-secondary" style="cursor:pointer"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.basicAuth"/></summary>
                    <div class="row mt-2">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label class="form-label" for="c2-hub-user"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.hubUser"/></label>
                                <input type="text" class="form-control" id="c2-hub-user" name="hubUser" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label class="form-label" for="c2-hub-password"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.hubPassword"/></label>
                                <input type="password" class="form-control" id="c2-hub-password" name="hubPassword" autocomplete="new-password">
                            </div>
                        </div>
                    </div>
                    <p class="text-body-secondary mb-0"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:connect.basicAuthHint"/></p>
                </details>
                <button type="submit" name="connect" value="1" class="btn btn-primary"><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:button.connect"/></button>
            </form>
        </f:else>
    </f:if>

    <h2><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:inventory.heading"/></h2>
    <p><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:inventory.agentVersion" arguments="{0: '{agentVersion}'}"/></p>

    <div class="table-fit mb-3">
        <table class="table table-striped">
            <thead>
                <tr><th><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:inventory.column.provider"/></th><th><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:inventory.column.state"/></th></tr>
            </thead>
            <tbody>
                <f:for each="{providers}" as="provider">
                    <tr>
                        <td class="col-nowrap"><code>{provider.key}</code></td>
                        <td class="col-nowrap">
                            <span class="badge badge-{provider.severity}">{provider.status}</span>
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>

    <details class="mb-3">
        <summary><f:translate key="LLL:EXT:caretaker2_agent/Resources/Private/Language/locallang.xlf:inventory.show"/></summary>
        <pre style="max-height:24rem;overflow:auto"><code>{inventoryJson}</code></pre>
    </details>

</html>
